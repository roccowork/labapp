name: pr-check
on:
  pull_request:
    branches: [main]       # 只在往 main 提 PR 时运行
jobs:
  test:
    runs-on: ubuntu-latest # GitHub 提供的云服务器，用完即删
    steps:
      - uses: actions/checkout@v7          # 拉代码
      - uses: actions/setup-go@v7          # 装 Go，版本按 go.mod 来
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -v ./...
      - run: docker build -t labapp:pr .   # 只构建，不推送